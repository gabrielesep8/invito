<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Un mazzo di rose per te ❤️</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Georgia,serif}main{height:100dvh;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#1d0b12,#000 72%)}canvas{display:block;width:100%;height:100%}button{position:absolute;bottom:7%;left:50%;transform:translateX(-50%);padding:15px 25px;border-radius:40px;border:1px solid #f6a5b4;background:#850c2a;color:white;font:17px Georgia;cursor:pointer;white-space:nowrap;box-shadow:0 0 35px #8e123d}h1{position:absolute;top:4%;width:100%;text-align:center;font-weight:normal;font-size:clamp(20px,3vw,36px);color:#ffc8d1;opacity:0;transition:opacity 1.5s}</style></head><body><main><canvas id="c" aria-label="Nove rose rosse con foglie, gambi e fiocco"></canvas><h1 id="msg">Nove rose, tutte per te ❤️</h1><button id="btn">Per te, un mazzo di rose ❤️</button></main><script>
const c=document.getElementById('c'),g=c.getContext('2d'),btn=document.getElementById('btn'),msg=document.getElementById('msg');let W,H,S,t=0,run=false;const F=[[-180,35,.88],[-90,-50,1.05],[0,-80,1.15],[90,-50,1.05],[180,35,.88],[-160,130,.9],[-55,105,1],[55,105,1],[160,130,.9]];const clamp=v=>Math.max(0,Math.min(1,v));function resize(){let d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);S=Math.min(W/750,H/750);draw(t)}addEventListener('resize',resize);
function leaf(x,y,a,side){g.save();g.translate(x,y);g.rotate(a);g.scale(side,1);let q=g.createLinearGradient(0,0,65,0);q.addColorStop(0,'#133c22');q.addColorStop(.6,'#3b8744');q.addColorStop(1,'#0c2b18');g.fillStyle=q;g.beginPath();g.moveTo(0,0);g.bezierCurveTo(15,-31,47,-36,67,-8);g.bezierCurveTo(43,17,20,12,0,0);g.fill();g.strokeStyle='#81a868';g.lineWidth=1;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(36,-8,67,-8);g.stroke();g.restore()}
function stem(x,y,p){let sx=x*.13,sy=285;g.lineWidth=5;g.lineCap='round';g.strokeStyle='#326b3a';g.beginPath();g.moveTo(sx,sy);g.quadraticCurveTo(x*.65,80,sx+(x-sx)*p,sy+(y-sy)*p);g.stroke();if(p>.55){g.globalAlpha=clamp((p-.55)*5);let lx=x*.62,ly=sy+(y-sy)*.63;leaf(lx,ly,-.7,-1);leaf(lx+5,ly-20,-1.5,1);g.globalAlpha=1}}
function petal(x,y,a,r,shade){g.save();g.translate(x,y);g.rotate(a);let grad=g.createRadialGradient(-r*.3,-r*.3,1,0,0,r*1.7);grad.addColorStop(0,shade[0]);grad.addColorStop(.55,shade[1]);grad.addColorStop(1,shade[2]);g.fillStyle=grad;g.strokeStyle='#61091d';g.lineWidth=.7;g.beginPath();g.moveTo(0,r*.5);g.bezierCurveTo(-r*1.2,r*.1,-r*1.1,-r*.85,-r*.25,-r);g.bezierCurveTo(r*.15,-r*1.15,r*.55,-r*.85,r*.85,-r*.35);g.bezierCurveTo(r*1.05,r*.2,r*.4,r*.65,0,r*.5);g.fill();g.stroke();g.restore()}
function rose(x,y,s,p){if(!p)return;g.save();g.translate(x,y);g.scale(s,s);g.globalAlpha=clamp(p*5);for(let j=0;j<5;j++){g.save();g.rotate(j*Math.PI*2/5);g.fillStyle='#285a2d';g.beginPath();g.moveTo(0,14);g.quadraticCurveTo(-19,0,-12,-24);g.quadraticCurveTo(2,-12,0,14);g.fill();g.restore()}g.translate(0,-16);const rings=[[7,31,41,['#ff5d72','#cc1134','#69051a']],[6,21,30,['#ff6b7c','#c80e34','#74051c']],[5,11,21,['#ff7b88','#b80c2e','#65051a']],[4,3,12,['#ff8a92','#b50d30','#65051a']]];let k=0;for(let [n,r,z,colors] of rings){for(let j=0;j<n;j++,k++){if(k>p*22)break;g.globalAlpha=clamp(p*22-k);let a=j*2*Math.PI/n+.25;petal(Math.cos(a)*r,Math.sin(a)*r*.6,a+Math.PI/2,z,colors)}}g.restore()}
function bow(p){g.save();g.globalAlpha=p;g.translate(0,225);for(let side of [-1,1]){let q=g.createLinearGradient(0,0,side*100,10);q.addColorStop(0,'#ff5d76');q.addColorStop(.6,'#c31a42');q.addColorStop(1,'#65051d');g.fillStyle=q;g.beginPath();g.moveTo(0,0);g.bezierCurveTo(side*70,-70,side*120,-35,side*96,10);g.bezierCurveTo(side*75,50,side*28,28,0,0);g.fill();g.beginPath();g.moveTo(0,10);g.bezierCurveTo(side*10,60,side*48,80,side*26,138);g.lineTo(side*56,118);g.bezierCurveTo(side*60,65,side*28,24,0,10);g.fill()}g.fillStyle='#fa4865';g.beginPath();g.ellipse(0,5,19,15,0,0,7);g.fill();g.restore()}
function draw(v){g.clearRect(0,0,W,H);g.save();g.translate(W/2,H*.52);g.scale(S,S);F.forEach(([x,y],i)=>stem(x,y,clamp((v-i*12)/70)));F.forEach(([x,y,s],i)=>rose(x,y,s,clamp((v-85-i*17)/85)));bow(clamp((v-310)/55));g.restore()}
function tick(){t++;draw(t);if(t<370)requestAnimationFrame(tick);else{msg.style.opacity='1';btn.style.opacity='1';btn.disabled=false;btn.textContent='Rivedi le rose ↻'}}btn.onclick=()=>{if(run&&btn.disabled)return;run=true;t=0;msg.style.opacity='0';btn.style.opacity='0';btn.disabled=true;tick()};resize();
</script></body></html>
